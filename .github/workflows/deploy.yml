name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # O il nome del tuo branch principale

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    # AGGIUNGI QUESTE DUE RIGHE QUI SOTTO:
    defaults:
      run:
        working-directory: app 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # AGGIUNGI ANCHE QUESTA RIGA QUI SOTTO:
          cache-dependency-path: app/package-lock.json 

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
      
      # ... (il resto del file rimane uguale, ma cambia il path dell'artifact)
      
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/dist' # Aggiungi app/ davanti a dist

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
